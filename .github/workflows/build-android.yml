name: Build for Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android Mod
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          
      - name: Download Geode CLI
        run: |
          curl -L https://github.com/geode-sdk/cli/releases/download/v3.8.0/geode-cli-v3.8.0-linux.zip -o cli.zip
          unzip cli.zip -d cli
          echo "$(pwd)/cli" >> $GITHUB_PATH
          
      - name: Setup Geode
        run: |
          geode profile create GithubActions
          geode profile set GithubActions
          geode sdk install v3.0.0
          
      - name: Build for Android
        run: |
          geode build --platform android --output build/
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: better-editor-unlock-android
          path: build/*.geode
