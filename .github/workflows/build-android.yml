name: Build for Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android Mod
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: |
          echo "y" | sdkmanager --install "ndk;26.3.11579264"

      - name: Clone Geode SDK
        run: |
          git clone --depth 1 --branch v3.0.0 https://github.com/geode-sdk/sdk.git geode-sdk

      - name: Build Android Mod
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264
          export GEODE_SDK=$(pwd)/geode-sdk
          mkdir -p build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DGEODE_SDK=$GEODE_SDK
          ninja

      - uses: actions/upload-artifact@v4
        with:
          name: better-editor-unlock-android
          path: build/*.geode
