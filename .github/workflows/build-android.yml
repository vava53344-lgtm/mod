name: Build Geode Mod

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          # Для Linux раннера, если не указать target, по умолчанию стоит Android64 [citation:1][citation:3].
          # Но лучше указать явно для надежности.
          target: Android64

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: Android64
          path: ${{ steps.build.outputs.build-output }}
