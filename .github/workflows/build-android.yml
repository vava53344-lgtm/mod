name: Build Geode Mod for Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          # Явно указываем цель для Android 64-bit, чтобы точно установить нужные бинарники
          target: Android64
          # Можно указать версию SDK, хотя она и так берется из mod.json
          # sdk: v5.3.0

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: Android64 Mod
          path: ${{ steps.build.outputs.build-output }}
