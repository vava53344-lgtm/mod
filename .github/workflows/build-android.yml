name: Build Geode Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          git \
          wget \
          unzip

    - name: Install Geode CLI
      run: |
        # Скачиваем Geode CLI
        wget https://github.com/geode-sdk/cli/releases/latest/download/geode-linux
        chmod +x geode-linux
        sudo mv geode-linux /usr/local/bin/geode
        geode --version

    - name: Install Geode binaries
      run: |
        geode sdk install-binaries Linux64

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        ninja

    - name: Package
      run: |
        cd build
        ninja package

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: geode-mod
        path: build/*.geode
