name: Build Geode Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          python3 \
          python3-pip \
          git \
          wget

    - name: Install Geode CLI
      run: |
        pip3 install geode-cli
        # Проверяем установку
        geode --version || echo "Geode CLI installed"

    - name: Install Geode binaries
      run: |
        # Устанавливаем бинарные файлы для Linux
        geode sdk install-binaries Linux64
        
        # Или для Android (если нужно)
        # geode sdk install-binaries Android64

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -G "Ninja" \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        ninja

    - name: Package mod
      run: |
        cd build
        ninja package

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: geode-mod
        path: build/*.geode
