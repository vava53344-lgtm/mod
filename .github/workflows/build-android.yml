name: Build for Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android Mod
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Geode CLI
        uses: geode-sdk/setup-geode@main
        with:
          sdk: v3.0.0
          
      - name: Build mod for Android
        run: |
          geode build --platform android --output build/
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: better-editor-unlock-android
          path: build/*.geode
